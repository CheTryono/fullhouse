name: Publicar Fullhouse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperar código
        uses: actions/checkout@v6
      - name: Preparar contenido público
        run: |
          mkdir public
          cp index.html app.js styles.css logo.svg public/
          cp -R vendor public/vendor
          touch public/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar página
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar
        uses: actions/deploy-pages@v4
        id: deployment