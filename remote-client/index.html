<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fullhouse · laboratorio remoto v1</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/auth.css"><style>body{margin:0}header,#controls{padding:12px}#remote-status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#remote-status p{margin:4px}#workspace{position:static;flex:none;height:auto}#workspace iframe.planner-frame{position:relative;inset:auto;width:100%;height:85dvh;border:0}#remote-status .btn{white-space:normal;overflow-wrap:anywhere;max-width:100%}input{max-width:100%}</style></head><body><header><strong>Fullhouse · solo laboratorio demo</strong><p>Datos sintéticos. Sin servicios reales. Los candidatos locales no son guardados remotos confirmados.</p><form id="login"><label>Correo <input id="email" type="email" required autocomplete="username"></label><label>Contraseña <input id="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Entrar</button></form><button class="btn secondary" id="logout">Cerrar sesión</button><p id="message" role="alert"></p></header><section id="controls"><div id="remote-status" role="status" aria-live="polite"></div></section><main id="workspace"></main><script src="/remote-lab.js"></script></body></html>
