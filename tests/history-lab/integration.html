<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fullhouse · Integración simulada</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/lab.css"></head><body><div id="lab" class="app-shell" data-theme="midnight"><header><h1>Integración histórica simulada</h1><p>Solo datos sintéticos. Las claves v01/v02 que se muestran pertenecen a un Map en memoria; nunca al almacenamiento del navegador.</p><a href="/">Laboratorio de lectura</a><div class="controls"><label>Nota sintética<textarea id="note">Nota sintética</textarea></label><button id="save-note">Guardar nota</button><button id="photo">Añadir imagen sintética</button><button id="step-one">Marcar primer paso</button><button id="step-two">Marcar segundo paso</button><button id="complete">Completar manualmente</button><button id="partial">Cerrar parcialmente</button><button id="reopen">Reabrir con motivo</button><button id="continue">Continuar otro día</button><button id="variants">Preparar alternativas</button><button id="base">Elegir base</button><button id="other">Corregir alternativa</button><button id="edit-routine">Editar rutina actual</button><button id="shift">Mover +15 minutos</button><button id="reschedule">Reprogramar desde mañana</button><button id="dependencies">Preparar dependencias</button><button id="delete-routine">Eliminar rutina</button></div><div class="controls"><button id="fail-write">Fallar próxima escritura de datos</button><button id="fail-read">Fallar lectura posterior</button><button id="before-manifest">Interrumpir antes del manifiesto</button><button id="after-manifest">Interrumpir después del manifiesto</button><button id="quota">Simular cuota casi llena</button><button id="restore-quota">Restaurar cuota simulada</button><button id="retry">Reintentar candidato</button><button id="new-tab">Preparar segunda pestaña</button><button id="other-write">Guardar desde segunda pestaña</button><button id="old-tab">Pestaña antigua cambia v1</button><button id="reopen-session">Reabrir sesión simulada</button><button id="recover">Recuperar intento verificado</button><button id="invalid-import">Intentar importación inválida</button><button id="legacy">Preparar registro heredado</button><button id="export">Exportar respaldo confirmado</button><button id="recovery-export">Exportar candidato y recuperación</button><button id="restore-export">Restaurar copia exportada en simulación nueva</button><button id="reset">Restablecer solo simulación</button></div><p id="status" role="status">Preparando simulación…</p></header><main><section class="metrics"><h2>Estado confirmado</h2><pre id="summary"></pre><div id="records"></div></section><section class="metrics"><h2>Candidato pendiente y recuperación</h2><pre id="pending"></pre><pre id="recovery-data"></pre></section></main></div><script src="/history-browser.js"></script><script src="/integration-view.js"></script></body></html>
